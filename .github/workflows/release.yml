name: Release

on:
  release:
    types: [published]

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    outputs:
      tarball: ${{ steps.pack.outputs.tarball }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npm run lint
      - run: npm test
      - id: pack
        run: |
          mkdir -p .release
          npm pack --json --pack-destination .release > .release/pack.json
          filename="$(node -e 'process.stdout.write(JSON.parse(require("fs").readFileSync(".release/pack.json", "utf8"))[0].filename)')"
          tarball=".release/$filename"
          test -f "$tarball"
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"
          echo "$tarball" > .release/tarball-path
      - name: Verify canonical package
        run: npm run verify:package -- "${{ steps.pack.outputs.tarball }}"
      - name: Record artifact checksum
        run: cd .release && sha256sum "$(basename "${{ steps.pack.outputs.tarball }}")" > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: release-artifact
          path: |
            ${{ steps.pack.outputs.tarball }}
            .release/SHA256SUMS
          if-no-files-found: error

  publish:
    if: vars.PI_CARD_NPM_PUBLISH_ENABLED == 'true'
    needs: quality-gate
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v4
        with:
          name: release-artifact
          path: .release
      - name: Verify release identity
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_NAME: ${{ github.event.release.name }}
        run: |
          test "$RELEASE_TAG" = "v$(node -p \"require('./package.json').version\")"
          test -n "$RELEASE_NAME"
      - name: Verify and select canonical tarball
        run: |
          (cd .release && sha256sum -c SHA256SUMS)
          tarball="$(find .release -name '*.tgz' -print -quit)"
          test -n "$tarball"
          echo "TARBALL=$tarball" >> "$GITHUB_ENV"
      - name: Publish to npm using configured trusted publishing
        env:
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          npm_tag=latest
          if [ "$RELEASE_PRERELEASE" = "true" ]; then npm_tag=next; fi
          npm publish "$TARBALL" --access public --tag "$npm_tag"
      - name: Attach canonical package and checksum to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" "$TARBALL" .release/SHA256SUMS
